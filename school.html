<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健行科大資管4甲-學士服統計系統</title>
    
    <meta property="og:title" content="健行科大資管4甲-學士服統計系統" />
    <meta property="og:description" content="資管4甲學士服團購尺寸統計，請同學盡速填寫！" />
    <meta property="og:type" content="website" />
    <!-- 加入 LINE / FB 縮圖預覽 -->
    <meta property="og:image" content="preview.jpg" />
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background-color: #f3f4f6; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        .modal-overlay { animation: overlayShow 0.3s ease-out forwards; }
        @keyframes overlayShow { from { opacity: 0; backdrop-filter: blur(0px); } to { opacity: 1; backdrop-filter: blur(4px); } }

        /* 隱藏數字輸入框的上下箭頭 */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        
        .btn-icon { display: flex; align-items: center; justify-content: center; }
        
        /* 自定義單選按鈕樣式 */
        .radio-card:checked + div {
            border-color: #1e3a8a; /* Tailwind blue-900 */
            background-color: #eff6ff; /* Tailwind blue-50 */
        }
        .radio-card:checked + div .check-icon {
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body class="text-gray-900 min-h-screen flex flex-col">

    <div id="root"></div>

    <script type="text/babel">
        // ==========================================
        //  設定區域
        // ==========================================
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx5Qi34i8NdTE9GSRClb5mmgvdEZQ72TFYWcMk1ylYVM8cxMWW5tqGYoxHkbdy9oOGpOg/exec";
        
        const { useState, useEffect } = React;

        // --- 圖示元件 ---
        const IconBase = ({ children, className, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`flex-shrink-0 ${className || 'w-5 h-5'}`} {...props}>
                {children}
            </svg>
        );

        const Icons = {
            GraduationCap: (props) => <IconBase {...props}><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></IconBase>,
            User: (props) => <IconBase {...props}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></IconBase>,
            Lock: (props) => <IconBase {...props}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></IconBase>,
            Save: (props) => <IconBase {...props}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></IconBase>,
            CheckCircle: (props) => <IconBase {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></IconBase>,
            Download: (props) => <IconBase {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></IconBase>,
            LogOut: (props) => <IconBase {...props}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></IconBase>,
            Edit: (props) => <IconBase {...props}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></IconBase>,
            X: (props) => <IconBase {...props}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></IconBase>,
            Trash2: (props) => <IconBase {...props}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></IconBase>,
            Info: (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></IconBase>,
            AlertTriangle: (props) => <IconBase {...props}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></IconBase>,
            Shirt: (props) => <IconBase {...props}><path d="M20.38 3.46L16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></IconBase>,
            Tie: (props) => <IconBase {...props}><path d="M10 2L7 9l5 13 5-13-3-7z"/><path d="M10 2l4 4"/><path d="M14 2l-4 4"/></IconBase>
        };

        // --- UI 共用元件 ---
        const MessageBox = ({ message, onClose }) => (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[70] p-4 modal-overlay">
                <div className="bg-white rounded-xl shadow-2xl w-full max-w-sm overflow-hidden fade-in">
                    <div className="p-4 bg-blue-900 flex justify-between items-center text-white">
                        <h3 className="font-bold flex items-center gap-2"><Icons.Info className="w-5 h-5"/> 系統提示</h3>
                        <button onClick={onClose} className="hover:bg-blue-800 p-1 rounded-full"><Icons.X className="w-5 h-5"/></button>
                    </div>
                    <div className="p-6 text-gray-700 text-center text-lg">{message}</div>
                    <div className="p-4 border-t flex justify-center bg-gray-50">
                        <button onClick={onClose} className="bg-blue-900 text-white px-8 py-2 rounded-lg hover:bg-blue-800 transition">確定</button>
                    </div>
                </div>
            </div>
        );

        const ConfirmBox = ({ message, onConfirm, onCancel }) => (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[70] p-4 modal-overlay">
                <div className="bg-white rounded-xl shadow-2xl w-full max-w-sm overflow-hidden fade-in">
                    <div className="p-4 bg-red-600 flex justify-between items-center text-white">
                        <h3 className="font-bold flex items-center gap-2"><Icons.AlertTriangle className="w-5 h-5"/> 確認操作</h3>
                        <button onClick={onCancel} className="hover:bg-red-700 p-1 rounded-full"><Icons.X className="w-5 h-5"/></button>
                    </div>
                    <div className="p-6 text-gray-700 text-center text-lg">{message}</div>
                    <div className="p-4 border-t flex justify-center gap-4 bg-gray-50">
                        <button onClick={onCancel} className="bg-gray-200 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-300 transition">取消</button>
                        <button onClick={onConfirm} className="bg-red-600 text-white px-6 py-2 rounded-lg hover:bg-red-700 transition">確定</button>
                    </div>
                </div>
            </div>
        );

        const Header = ({ setView, view }) => (
            <header className="bg-blue-900 text-white shadow-lg sticky top-0 z-50">
                <div className="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
                    <div className="flex items-center gap-2 cursor-pointer" onClick={() => setView('form')}>
                        <Icons.GraduationCap className="w-7 h-7 text-yellow-400" />
                        <h1 className="text-lg md:text-xl font-bold tracking-wider truncate">健行科大資管4甲</h1>
                    </div>
                    <nav className="flex gap-2">
                        <button onClick={() => setView('form')} className={`btn-icon text-xs md:text-sm px-3 py-2 rounded-md transition gap-1.5 whitespace-nowrap active:scale-95 ${(view==='form' || view==='list') ? 'bg-blue-800 text-yellow-400' : 'hover:bg-blue-800'}`}>
                            <Icons.User className="w-4 h-4" /> 填寫統計
                        </button>
                        <button onClick={() => setView('admin')} className={`btn-icon text-xs md:text-sm px-3 py-2 rounded-md transition gap-1.5 whitespace-nowrap active:scale-95 ${view==='admin' ? 'bg-blue-800 text-yellow-400' : 'hover:bg-blue-800'}`}>
                            <Icons.Lock className="w-4 h-4" /> 管理後台
                        </button>
                    </nav>
                </div>
            </header>
        );

        const RegistrationForm = ({ onSubmit, isSubmitting, showMessage, currentCount, setView }) => {
            const [formData, setFormData] = useState({ 
                studentId: '', 
                name: '', 
                size: '', 
                addCollar: false 
            });
            const [showSuccess, setShowSuccess] = useState(false);

            const handleChange = (e) => {
                const { name, value, type, checked } = e.target;
                setFormData(prev => ({ 
                    ...prev, 
                    [name]: type === 'checkbox' ? checked : value 
                }));
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                
                // 基礎防呆驗證
                if (!formData.studentId || formData.studentId.trim() === '') {
                    return showMessage("請輸入您的學號！");
                }
                if (!formData.name || formData.name.trim() === '') {
                    return showMessage("請輸入您的姓名！");
                }
                if (!formData.size) {
                    return showMessage("請選擇學士服尺寸！");
                }
                
                const success = await onSubmit(formData);
                if (success) setShowSuccess(true);
            };

            if (showSuccess) return (
                <div className="flex flex-col items-center justify-center p-8 bg-white rounded-xl shadow-lg mt-6 text-center fade-in mx-4 border-t-4 border-green-500">
                    <Icons.CheckCircle className="w-20 h-20 text-green-500 mb-4" />
                    <h2 className="text-2xl font-bold text-gray-800 mb-2">提交成功！</h2>
                    <p className="text-gray-600 mb-6">您的學士服尺寸與加購資訊已記錄。</p>
                    <div className="bg-blue-50 p-4 rounded-lg border border-blue-100 text-sm text-blue-800 w-full max-w-sm">
                        <p className="font-bold mb-1">您填寫的資料：</p>
                        <p>學號：{formData.studentId}</p>
                        <p>姓名：{formData.name}</p>
                        <p>尺寸：{formData.size}</p>
                        <p>假領子：{formData.addCollar ? '加購' : '不加購'}</p>
                    </div>
                    <button onClick={() => {setShowSuccess(false); setFormData({studentId: '', name: '', size: '', addCollar: false})}} className="mt-6 text-blue-600 hover:text-blue-800 font-medium underline">返回重新填寫</button>
                </div>
            );

            const sizes = [
                { id: 'S', label: 'S', desc: '適合 160cm 以下' },
                { id: 'M', label: 'M', desc: '適合 160cm ~ 170cm' },
                { id: 'L', label: 'L', desc: '適合 170cm ~ 180cm' },
                { id: 'XL', label: 'XL', desc: '適合 180cm 以上' }
            ];

            return (
                <form onSubmit={handleSubmit} className="bg-white rounded-xl shadow-lg p-5 md:p-8 mt-4 md:mt-0 mx-2 md:mx-0 fade-in border-t-4 border-blue-900">
                    <div className="flex flex-col md:flex-row md:justify-between md:items-end mb-6 border-b pb-4 gap-3">
                        <h2 className="text-xl md:text-2xl font-bold text-gray-800 flex items-center gap-2">
                            <Icons.GraduationCap className="text-blue-900 w-7 h-7" /> 
                            學士服登記表單
                        </h2>
                        <div className="flex items-center gap-2">
                            <button type="button" onClick={() => setView('list')} className="text-sm bg-blue-100 text-blue-900 hover:bg-blue-200 px-3 py-1.5 rounded-lg border border-blue-200 font-bold shadow-sm transition-colors flex items-center gap-1 active:scale-95">
                                <Icons.User className="w-4 h-4" /> 查看名單
                            </button>
                            <div className="text-sm bg-blue-50 text-blue-800 px-3 py-1.5 rounded-lg border border-blue-100 font-bold shadow-sm">
                                目前已登記人數：{currentCount || 0} 人
                            </div>
                        </div>
                    </div>
                    
                    <div className="space-y-6 mb-8">
                        {/* 基本資料區塊 */}
                        <div className="bg-gray-50 p-5 border border-gray-200 rounded-xl">
                            <h3 className="font-bold text-gray-700 mb-4 flex items-center gap-2 text-lg">
                                <span className="w-1.5 h-5 bg-blue-900 rounded-full block"></span> 基本資料
                            </h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1.5">學號 <span className="text-red-500">*</span></label>
                                    <input required type="text" name="studentId" value={formData.studentId} onChange={handleChange} placeholder="如：C11433100" className="w-full p-3 border border-gray-300 rounded-lg text-lg focus:ring-2 focus:ring-blue-900 focus:border-blue-900 focus:outline-none transition-shadow bg-white" />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1.5">姓名 <span className="text-red-500">*</span></label>
                                    <input required type="text" name="name" value={formData.name} onChange={handleChange} placeholder="請輸入真實姓名" className="w-full p-3 border border-gray-300 rounded-lg text-lg focus:ring-2 focus:ring-blue-900 focus:border-blue-900 focus:outline-none transition-shadow bg-white" />
                                </div>
                            </div>
                        </div>

                        {/* 尺寸選擇區塊 */}
                        <div className="bg-gray-50 p-5 border border-gray-200 rounded-xl">
                            <h3 className="font-bold text-gray-700 mb-4 flex items-center gap-2 text-lg">
                                <span className="w-1.5 h-5 bg-yellow-500 rounded-full block"></span> 學士服尺寸 <span className="text-red-500">*</span>
                            </h3>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                {sizes.map((s) => (
                                    <label key={s.id} className="relative cursor-pointer">
                                        <input type="radio" name="size" value={s.id} checked={formData.size === s.id} onChange={handleChange} className="peer sr-only radio-card" />
                                        <div className="p-4 border-2 border-gray-200 rounded-xl bg-white hover:bg-gray-50 transition-all flex items-center justify-between">
                                            <div className="flex items-center gap-3">
                                                <div className="bg-gray-100 p-2 rounded-full text-gray-600 peer-checked:text-blue-900">
                                                    <Icons.Shirt className="w-6 h-6" />
                                                </div>
                                                <div>
                                                    <div className="font-bold text-lg text-gray-800">{s.id} 號</div>
                                                    <div className="text-sm text-gray-500">{s.desc}</div>
                                                </div>
                                            </div>
                                            <div className="check-icon opacity-0 transform scale-50 transition-all duration-200 text-blue-900">
                                                <Icons.CheckCircle className="w-6 h-6" />
                                            </div>
                                        </div>
                                    </label>
                                ))}
                            </div>
                        </div>

                        {/* 加購選項區塊 */}
                        <div className="bg-gray-50 p-5 border border-gray-200 rounded-xl">
                            <h3 className="font-bold text-gray-700 mb-4 flex items-center gap-2 text-lg">
                                <span className="w-1.5 h-5 bg-green-600 rounded-full block"></span> 加購項目
                            </h3>
                            <div className="flex flex-col md:flex-row gap-4 items-stretch">
                                <label className={`flex-1 flex items-center justify-between cursor-pointer p-4 rounded-xl border-2 transition-all select-none ${formData.addCollar ? 'bg-green-50 border-green-600' : 'bg-white border-gray-200 hover:bg-gray-50'}`}>
                                    <div className="flex items-center gap-3">
                                        <div className={`p-2 rounded-full ${formData.addCollar ? 'bg-green-200 text-green-800' : 'bg-gray-100 text-gray-500'}`}>
                                            <Icons.Tie className="w-6 h-6" />
                                        </div>
                                        <div>
                                            <span className={`block font-bold text-lg ${formData.addCollar ? 'text-green-800' : 'text-gray-700'}`}>
                                                加購「假領子」
                                            </span>
                                            <span className="text-sm text-gray-500 block mt-0.5">學士服標準配件未含假領子，如需拍照效果更好可加購。</span>
                                        </div>
                                    </div>
                                    <div className="relative flex-shrink-0 ml-4">
                                        <input type="checkbox" name="addCollar" checked={formData.addCollar} onChange={handleChange} className="sr-only" />
                                        <div className={`block w-14 h-8 rounded-full transition-colors ${formData.addCollar ? 'bg-green-500' : 'bg-gray-300'}`}></div>
                                        <div className={`absolute left-1 top-1 bg-white w-6 h-6 rounded-full transition-transform ${formData.addCollar ? 'transform translate-x-6' : ''}`}></div>
                                    </div>
                                </label>
                                
                                {/* 假領子參考圖片 */}
                                <div className="w-full md:w-48 bg-white border border-gray-200 rounded-xl p-2 flex flex-col justify-center items-center">
                                    <img src="002.jpg" alt="假領子實拍" className="w-full h-auto max-h-32 object-contain rounded-lg" onError={(e) => { e.target.style.display = 'none' }} />
                                    <span className="text-xs text-gray-400 mt-2">▲ 假領子參考圖</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <button type="submit" disabled={isSubmitting} className={`btn-icon w-full py-4 px-6 rounded-xl font-bold text-lg text-white shadow-lg transition transform hover:-translate-y-0.5 active:translate-y-0 gap-2 ${isSubmitting ? 'bg-gray-400 cursor-not-allowed' : 'bg-blue-900 hover:bg-blue-800'}`}>
                        {isSubmitting ? '資料傳送中...' : <><Icons.Save className="w-6 h-6" /> 確認送出登記</>}
                    </button>
                </form>
            );
        };

        const AdminLogin = ({ onLogin }) => {
            const [password, setPassword] = useState('');
            const [error, setError] = useState(false);
            const handleSubmit = (e) => {
                e.preventDefault();
                // 預設密碼 admin888
                if (password === 'admin888') onLogin(true);
                else setError(true);
            };
            return (
                <div className="max-w-md mx-auto mt-10 bg-white p-8 rounded-xl shadow-lg border-t-4 border-blue-900 mx-4 fade-in">
                    <div className="text-center mb-6">
                        <div className="bg-blue-50 p-3 rounded-full w-16 h-16 flex items-center justify-center mx-auto mb-4 text-blue-900"><Icons.Lock className="w-8 h-8" /></div>
                        <h2 className="text-xl font-bold text-gray-800">管理員登入</h2>
                        <p className="text-sm text-gray-500 mt-2">請輸入管理密碼 (預設: admin888)</p>
                    </div>
                    <form onSubmit={handleSubmit} className="space-y-4">
                        <input type="password" placeholder="請輸入密碼" className="w-full p-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-900 outline-none transition text-lg" value={password} onChange={(e) => { setPassword(e.target.value); setError(false); }} />
                        {error && <p className="text-red-500 text-sm text-center font-medium">密碼錯誤，請重試。</p>}
                        <button className="w-full bg-blue-900 text-white py-3 rounded-lg font-bold hover:bg-blue-800 transition shadow text-lg">登入後台</button>
                    </form>
                </div>
            );
        };

        const AdminDashboard = ({ registrations, onLogout, onAction, showMessage, setConfirmDialog }) => {
            // 統計各尺寸數量與領結數量
            const stats = registrations.reduce((acc, curr) => {
                if (curr.size) acc[curr.size] = (acc[curr.size] || 0) + 1;
                if (curr.addCollar) acc.collar += 1;
                return acc;
            }, { S: 0, M: 0, L: 0, XL: 0, collar: 0 });

            const exportToCSV = () => {
                let csvContent = "\uFEFF序號,登記時間,學號,姓名,尺寸,假領子加購\n";
                
                registrations.forEach((reg, index) => {
                    const date = new Date(reg.timestamp).toLocaleString();
                    const collarStr = reg.addCollar ? "是" : "否";
                    csvContent += `"${index + 1}","${date}","${reg.studentId}","${reg.name}","${reg.size}","${collarStr}"\n`;
                });
                
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `資管4甲學士服統計_${new Date().toISOString().slice(0,10)}.csv`;
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
            };

            const handleDelete = (id, name) => {
                setConfirmDialog({
                    message: `確定要刪除「${name}」的登記資料嗎？此操作無法還原。`,
                    onConfirm: () => {
                        onAction({ action: 'delete', userId: id });
                        setConfirmDialog(null);
                    }
                });
            };

            const adminBtnClass = "btn-icon flex-1 md:flex-none justify-center px-4 py-2.5 rounded-lg shadow-sm font-medium text-sm whitespace-nowrap gap-2 transition";

            return (
                <div className="mt-2 md:mt-6 fade-in pb-10">
                    {/* 數據統計儀表板 */}
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4 mx-2 md:mx-0">
                        <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200 text-center">
                            <div className="text-gray-500 text-sm font-bold mb-1">總登記人數</div>
                            <div className="text-3xl font-extrabold text-blue-900">{registrations.length}</div>
                        </div>
                        <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200 text-center">
                            <div className="text-gray-500 text-sm font-bold mb-1">加購假領子</div>
                            <div className="text-3xl font-extrabold text-green-600">{stats.collar}</div>
                        </div>
                        <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200 text-center col-span-2 md:col-span-2 flex flex-col justify-center">
                            <div className="text-gray-500 text-sm font-bold mb-2">尺寸統計分布</div>
                            <div className="flex justify-around text-lg font-bold text-gray-700">
                                <div>S: <span className="text-blue-600">{stats.S}</span></div>
                                <div>M: <span className="text-blue-600">{stats.M}</span></div>
                                <div>L: <span className="text-blue-600">{stats.L}</span></div>
                                <div>XL: <span className="text-blue-600">{stats.XL}</span></div>
                            </div>
                        </div>
                    </div>

                    <div className="flex flex-col gap-4 bg-white p-4 rounded-xl shadow-sm border border-gray-200 mx-2 md:mx-0">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <h2 className="text-xl font-bold text-gray-800 flex items-center gap-2">
                                <Icons.User className="w-6 h-6 text-blue-900" /> 詳細名單管理
                            </h2>
                            <div className="flex gap-2 w-full md:w-auto">
                                <button onClick={exportToCSV} className={`${adminBtnClass} bg-green-600 hover:bg-green-700 text-white`}>
                                    <Icons.Download className="w-4 h-4" /> 匯出 CSV 名單
                                </button>
                                <button onClick={onLogout} className={`${adminBtnClass} bg-gray-100 hover:bg-gray-200 text-gray-700`}>
                                    <Icons.LogOut className="w-4 h-4" /> 登出
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-200 mt-4 mx-2 md:mx-0">
                        <div className="overflow-x-auto">
                            <table className="min-w-full divide-y divide-gray-200">
                                <thead className="bg-gray-50">
                                    <tr>
                                        <th className="px-5 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">學號</th>
                                        <th className="px-5 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">姓名</th>
                                        <th className="px-5 py-3 text-center text-xs font-bold text-gray-500 uppercase tracking-wider">尺寸</th>
                                        <th className="px-5 py-3 text-center text-xs font-bold text-gray-500 uppercase tracking-wider">假領子</th>
                                        <th className="px-5 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">登記時間</th>
                                        <th className="px-5 py-3 text-right text-xs font-bold text-gray-500 uppercase tracking-wider">操作</th>
                                    </tr>
                                </thead>
                                <tbody className="bg-white divide-y divide-gray-200">
                                    {registrations.length === 0 ? 
                                        <tr><td colSpan="6" className="text-center py-10 text-gray-400">目前尚無登記資料</td></tr> :
                                        registrations.map((reg) => (
                                        <tr key={reg.userId} className="hover:bg-blue-50/50 transition">
                                            <td className="px-5 py-4 whitespace-nowrap text-gray-600 font-mono">{reg.studentId}</td>
                                            <td className="px-5 py-4 whitespace-nowrap font-bold text-gray-900">{reg.name}</td>
                                            <td className="px-5 py-4 whitespace-nowrap text-center">
                                                <span className="bg-blue-100 text-blue-800 font-bold px-2.5 py-1 rounded-md">{reg.size}</span>
                                            </td>
                                            <td className="px-5 py-4 whitespace-nowrap text-center">
                                                {reg.addCollar ? 
                                                    <span className="text-green-600 font-bold flex justify-center items-center gap-1"><Icons.CheckCircle className="w-4 h-4"/> 加購</span> : 
                                                    <span className="text-gray-400">-</span>
                                                }
                                            </td>
                                            <td className="px-5 py-4 whitespace-nowrap text-sm text-gray-500">
                                                {new Date(reg.timestamp).toLocaleString('zh-TW', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'})}
                                            </td>
                                            <td className="px-5 py-4 whitespace-nowrap text-right">
                                                <button onClick={() => handleDelete(reg.userId, reg.name)} className="btn-icon inline-flex text-red-500 p-2 bg-white border border-red-200 rounded-lg hover:bg-red-50 transition ml-auto" title="刪除">
                                                    <Icons.Trash2 className="w-4 h-4" />
                                                </button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const PublicList = ({ registrations, setView }) => {
            return (
                <div className="mt-2 md:mt-6 fade-in pb-10 flex-grow">
                    <div className="flex flex-col gap-4 bg-white p-4 rounded-xl shadow-sm border border-gray-200 mx-2 md:mx-0 mb-4">
                        <div className="flex justify-between items-center">
                            <h2 className="text-xl font-bold text-gray-800 flex items-center gap-2">
                                <Icons.User className="w-6 h-6 text-blue-900" /> 已登記名單
                            </h2>
                            <button onClick={() => setView('form')} className="btn-icon bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium transition active:scale-95">
                                返回表單
                            </button>
                        </div>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-200 mx-2 md:mx-0">
                        <div className="overflow-x-auto">
                            <table className="min-w-full divide-y divide-gray-200">
                                <thead className="bg-gray-50">
                                    <tr>
                                        <th className="px-5 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">學號</th>
                                        <th className="px-5 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">姓名</th>
                                        <th className="px-5 py-3 text-center text-xs font-bold text-gray-500 uppercase tracking-wider">尺寸</th>
                                        <th className="px-5 py-3 text-center text-xs font-bold text-gray-500 uppercase tracking-wider">假領子</th>
                                        <th className="px-5 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">登記時間</th>
                                    </tr>
                                </thead>
                                <tbody className="bg-white divide-y divide-gray-200">
                                    {registrations.length === 0 ? 
                                        <tr><td colSpan="5" className="text-center py-10 text-gray-400">目前尚無登記資料</td></tr> :
                                        registrations.map((reg) => (
                                        <tr key={reg.userId} className="hover:bg-blue-50/50 transition">
                                            <td className="px-5 py-4 whitespace-nowrap text-gray-600 font-mono">{reg.studentId}</td>
                                            <td className="px-5 py-4 whitespace-nowrap font-bold text-gray-900">{reg.name}</td>
                                            <td className="px-5 py-4 whitespace-nowrap text-center">
                                                <span className="bg-blue-100 text-blue-800 font-bold px-2.5 py-1 rounded-md">{reg.size}</span>
                                            </td>
                                            <td className="px-5 py-4 whitespace-nowrap text-center">
                                                {reg.addCollar ? 
                                                    <span className="text-green-600 font-bold flex justify-center items-center gap-1"><Icons.CheckCircle className="w-4 h-4"/> 加購</span> : 
                                                    <span className="text-gray-400">-</span>
                                                }
                                            </td>
                                            <td className="px-5 py-4 whitespace-nowrap text-sm text-gray-500">
                                                {new Date(reg.timestamp).toLocaleString('zh-TW', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'})}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('form');
            const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
            const [registrations, setRegistrations] = useState([]);
            const [isLoadingData, setIsLoadingData] = useState(true);
            const [isSubmitting, setIsSubmitting] = useState(false);
            
            const [messageContent, setMessageContent] = useState(null);
            const [confirmDialog, setConfirmDialog] = useState(null);

            const showMessage = (msg) => setMessageContent(msg);

            // 模擬初始資料載入 (為展示用，若 GAS 尚未設定)
            useEffect(() => {
                if (GOOGLE_SCRIPT_URL.includes("請將這裡")) {
                    // 若尚未設定網址，載入一些測試用假資料，以便預覽效果
                    setTimeout(() => {
                        setRegistrations([
                            { userId: 'u1', studentId: 'A10912001', name: '王大明', size: 'L', addCollar: true, timestamp: new Date(Date.now() - 86400000).toISOString() },
                            { userId: 'u2', studentId: 'A10912002', name: '林小美', size: 'S', addCollar: false, timestamp: new Date(Date.now() - 3600000).toISOString() },
                            { userId: 'u3', studentId: 'A10912003', name: '陳建宏', size: 'XL', addCollar: true, timestamp: new Date().toISOString() },
                        ]);
                        setIsLoadingData(false);
                    }, 800);
                    return;
                }
                
                // 實際串接 GAS 的流程
                setIsLoadingData(true);
                fetch(GOOGLE_SCRIPT_URL)
                    .then(res => res.json())
                    .then(data => {
                        setRegistrations(data.reverse()); // 讓最新的在前面
                        setIsLoadingData(false);
                    })
                    .catch(err => {
                        console.error("Error fetching data:", err);
                        setIsLoadingData(false);
                        showMessage("讀取資料失敗，請確認 Google Apps Script 網址是否正確。");
                    });
            }, []);

            // 處理表單送出或管理員操作 (新增/刪除)
            const handleAction = async (payload) => {
                // 如果未設定 GAS 網址，使用本地狀態模擬運作，確保在 Canvas 預覽中可互動
                if (GOOGLE_SCRIPT_URL.includes("請將這裡")) {
                    setIsSubmitting(true);
                    return new Promise((resolve) => {
                        setTimeout(() => {
                            if (payload.action === 'add') {
                                const newReg = {
                                    ...payload,
                                    timestamp: new Date().toISOString()
                                };
                                setRegistrations(prev => [newReg, ...prev]);
                            } else if (payload.action === 'delete') {
                                setRegistrations(prev => prev.filter(r => r.userId !== payload.userId));
                                showMessage('資料已成功刪除 (測試環境模擬)');
                            }
                            setIsSubmitting(false);
                            resolve(true);
                        }, 600);
                    });
                }

                // 實際呼叫 GAS API
                setIsSubmitting(true);
                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload),
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                    });
                    
                    // 重新獲取資料 (這裡簡化處理，實際建議重打 API 或直接更新 state)
                    if (payload.action === 'add') {
                        setRegistrations(prev => [{...payload, timestamp: new Date().toISOString()}, ...prev]);
                    } else if (payload.action === 'delete') {
                        setRegistrations(prev => prev.filter(r => r.userId !== payload.userId));
                        showMessage('資料已成功刪除');
                    }
                    setIsSubmitting(false); 
                    return true;
                } catch (e) { 
                    console.error(e); 
                    showMessage("連線失敗，請檢查您的網路連線狀態"); 
                    setIsSubmitting(false); 
                    return false; 
                }
            };

            const handleSubmission = async (formData) => {
                const payload = { 
                    ...formData, 
                    action: 'add', 
                    userId: 'user_' + Date.now() + Math.random().toString(36).substr(2, 5) 
                };
                return await handleAction(payload);
            };

            return (
                <div className="flex-grow flex flex-col">
                    <Header setView={setView} view={view} />
                    
                    <main className="max-w-4xl mx-auto w-full px-0 md:px-4 flex-grow">
                        {view === 'form' && (
                            <>
                                <div className="mt-6 md:mt-8 mb-6 px-4">
                                    <div className="bg-blue-900 rounded-2xl p-6 md:p-8 text-center shadow-lg relative overflow-hidden mb-6">
                                        {/* 背景裝飾 */}
                                        <div className="absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none">
                                            <svg className="w-full h-full" xmlns="http://www.w3.org/2000/svg">
                                                <defs>
                                                    <pattern id="pattern" width="40" height="40" patternUnits="userSpaceOnUse">
                                                        <path d="M0 40L40 0H20L0 20M40 40V20L20 40" fill="currentColor" />
                                                    </pattern>
                                                </defs>
                                                <rect width="100%" height="100%" fill="url(#pattern)" />
                                            </svg>
                                        </div>
                                        <div className="relative z-10">
                                            <h2 className="text-2xl md:text-3xl font-extrabold text-white mb-2 tracking-wide">🎓 健行科大資管系 4甲</h2>
                                            <h3 className="text-xl md:text-2xl font-bold text-yellow-400 mb-4">學士服團體租購統計</h3>
                                            <p className="text-blue-100 text-sm md:text-base max-w-lg mx-auto">
                                                各位同學好，若有意願參加畢業典禮學士服團體購買，請協助填寫您的尺寸與加購意願，此統計為先計算數量，以利於後續和廠商談，感謝配合！<br />
                                                目前價格尚未確認，預估學士服含領帶約$240、假領子約$50 
                                            </p>
                                        </div>
                                    </div>
                                    
                                    {/* 插入學士服參考圖 */}
                                    <div className="max-w-md mx-auto bg-white p-2 rounded-xl shadow-sm border border-gray-100 fade-in">
                                        <img src="001.jpg" alt="學士服樣式參考" className="w-full h-auto rounded-lg object-cover" onError={(e) => { e.target.style.display = 'none' }} />
                                        <p className="text-center text-gray-500 text-xs mt-2 font-medium">▲ 健行科大學士服樣式參考</p>
                                    </div>
                                </div>
                                
                                {isLoadingData ? (
                                    <div className="flex flex-col items-center justify-center py-16 bg-white rounded-xl shadow-sm border border-gray-100 mx-2 md:mx-0">
                                        <div className="animate-spin rounded-full h-12 w-12 border-4 border-blue-100 border-t-blue-900 mb-4"></div>
                                        <p className="text-gray-500 font-medium">系統連線中，載入資料...</p>
                                    </div>
                                ) : (
                                    <RegistrationForm 
                                        onSubmit={handleSubmission} 
                                        isSubmitting={isSubmitting} 
                                        showMessage={showMessage} 
                                        currentCount={registrations.length}
                                        setView={setView}
                                    />
                                )}
                            </>
                        )}

                        {view === 'list' && (
                            <PublicList registrations={registrations} setView={setView} />
                        )}
                        
                        {/* 彈窗渲染區 */}
                        {messageContent && <MessageBox message={messageContent} onClose={() => setMessageContent(null)} />}
                        {confirmDialog && <ConfirmBox message={confirmDialog.message} onConfirm={confirmDialog.onConfirm} onCancel={() => setConfirmDialog(null)} />}
                        
                        {view === 'admin' && (
                            !isAdminLoggedIn ? 
                                <AdminLogin onLogin={setIsAdminLoggedIn} /> : 
                                <AdminDashboard 
                                    registrations={registrations} 
                                    onLogout={() => setIsAdminLoggedIn(false)} 
                                    onAction={handleAction} 
                                    showMessage={showMessage} 
                                    setConfirmDialog={setConfirmDialog} 
                                />
                        )}
                    </main>

                    <footer className="mt-12 py-6 text-center text-gray-500 text-sm bg-white border-t border-gray-200">
                        &copy; {new Date().getFullYear()} By 健行科大資管系4甲 君威
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
